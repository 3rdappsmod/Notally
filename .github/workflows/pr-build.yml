name: Build (on PR)

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "*.mp4"
      - "Privacy-Policy.txt"
      - "LICENSE.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
