version: 2

registries:
  maven-google:
    type: maven-repository
    url: "https://dl.google.com/dl/android/maven2/"

  maven-central:
    type: maven-repository
    url: "https://repo.maven.apache.org/maven2"

  jitpack:
    type: maven-repository
    url: "https://www.jitpack.io"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-central
      - maven-google
      - jitpack
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # ksp's version was pinned as <kotlin-version>-<ksp-version>, so it must move
      # in lockstep with kotlin-gradle-plugin or the build fails with a version
      # mismatch error. Bundling them forces Dependabot to bump both together.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
    ignore:
      # Glide 5.x requires compileSdk 37, but AGP 9.0.1 (our current version) only
      # supports up to compileSdk 36. Re-enable once AGP/compileSdk are raised.
      - dependency-name: "com.github.bumptech.glide:glide"
        update-types: ["version-update:semver-major"]
